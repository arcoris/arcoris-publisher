apiVersion: arcpub.arcoris.dev/v1alpha1
kind: ModuleManifest
metadata:
  name: projection
module:
  type: go
  path: arcoris.dev/projection
verification:
  go:
    list: false
    test: false
    tidy: false
publish:
  entries:
    - type: file
      from: go.mod
      to: go.mod
    - type: directory
      from: public
      to: public
