apiVersion: arcpub.arcoris.dev/v1alpha1
kind: StagingManifest
metadata:
  name: arcoris-e2e-bad
source:
  repository: arcoris/e2e-bad
  defaultBranch: main
  stagingRoot: .
  moduleRoot: staging
publish:
  mode: explicit-projection
  versionPolicy: release-train
  pushPolicy: fast-forward-only
defaults:
  branches:
    - source: main
      target: main
modules:
  - name: broken
    sourceDir: staging/broken
    repository: arcoris/broken
