apiVersion: arcpub.arcoris.dev/v1alpha1
kind: StagingManifest
metadata:
  name: arcoris-e2e
source:
  repository: arcoris/e2e
  defaultBranch: main
  stagingRoot: .
  moduleRoot: staging
publish:
  mode: explicit-projection
  versionPolicy: release-train
  pushPolicy: fast-forward-only
defaults:
  branches:
    - source: main
      target: main
modules:
  - name: foundation
    sourceDir: staging/foundation
    repository: arcoris/foundation
  - name: control
    sourceDir: staging/control
    repository: arcoris/control
